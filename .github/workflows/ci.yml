name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec depcruise packages apps
      - run: pnpm run test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter app run build
      - run: cd apps/app && npx cap sync android
      - run: cd apps/app/android && ./gradlew assembleDebug
      - name: Stage APK for release
        run: cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk formulaflash-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: formulaflash-debug.apk
      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Latest Build (Android APK)"
          body: |
            Automated Android build generated on push to `main` (`${{ github.sha }}`).

            ### Direct Download
            Download and install directly on Android:
            - **[formulaflash-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/formulaflash-debug.apk)**
          prerelease: true
          make_latest: true
          files: formulaflash-debug.apk
