name: E2E Matrix & Stateful Sequence Testing

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * *' # Nightly run at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test:smoke
      - name: Verify action coverage
        run: node scripts/verify-actions-coverage.mjs

  matrix-sharded:
    name: Full Matrix & Stateful Testing (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=desktop-chrome --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  report:
    name: Generate Matrix Verification Report
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-matrix-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: test-matrix-report
          path: docs/test-matrix.md
